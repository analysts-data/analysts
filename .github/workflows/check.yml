name: check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Protected paths
        if: github.event_name == 'pull_request'
        env:
          # label from the event payload: gh pr view without a number fails on the detached checkout
          HUMAN_OK: ${{ contains(github.event.pull_request.labels.*.name, 'human-ok') }}
        run: |
          if [ "$HUMAN_OK" = "true" ]; then
            echo "PROTECTED_ALLOW=1" >> "$GITHUB_ENV"
            scripts/protected_paths.sh --allow
          else
            scripts/protected_paths.sh
          fi

      - name: Commit messages
        run: scripts/commit_messages.sh

      - name: make check
        run: make check

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install Playwright chromium
        run: uv run playwright install chromium --with-deps

      - name: make e2e
        run: make e2e
