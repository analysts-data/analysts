      ${S.cl.sections.map((s, si) => { const cs = S.cl.criteria.filter(x => x.sec === si); if (!cs.length) return ''; const sc = c.secs.find(x => x.name === s);
        return `<div class="sechead"><span>${esc(s)}</span><span>${sc ? `${fn(sc.g)} / ${sc.w}` : ''}</span></div>` + cs.map(cr => critHTML(d, cr, open)).join(''); }).join('')}
    </section>
  </div>
  <p class="muted xs">Оценка: DeepSeek V4 Pro (рассуждение low), второе мнение Jev. ${scored().length + (fr ? fr.questions.length : 0)} вызовов основной модели и 1 запрос второго мнения, около 8 секунд, $${fn(COST[d.ch])}.</p>`;
}

function trHTML(d, open) {
  if (!d.lines) return `<div class="empty">Расшифровка этого диалога не входит в учебный макет. Оценка и обоснования справа — в том виде, в каком их видит специалист.</div>`;
  const tags = {};
  for (const cr of S.cl.criteria) {
    const r = d.res[cr.id]; if (!r || !r.ev) continue;
    const t = cr.type === 'flag' ? (Object.values(r.a || {}).some(Boolean) ? 'c-risk' : 'c-ok') : tone(cr, ans(d, cr.id));
    r.ev.forEach(n => (tags[n] = tags[n] || []).push({id:cr.id, t}));
  }
  const sel = new Set((d.res[open] && d.res[open].ev) || []);
  return d.lines.map(l => {
    if (l.fold) return `<div class="fold"><span>${d.ch === 'call' ? `${mmss(l.t0)}–${mmss(l.t1)}, ` : ''}<b>${esc(l.label)}</b>, реплики ${l.from}${l.to !== l.from ? '–' + l.to : ''}. <span class="muted">Модель видит участок как контекст, но не оценивает.</span></span></div>`;
    const tg = (tags[l.n] || []).map(x => `<button type="button" class="chip ${x.t}" data-act="crit" data-cid="${x.id}" aria-label="Открыть критерий ${x.id}">${x.id}</button>`).join(' ');
    const time = d.ch === 'call' ? mmss(l.e) : esc(l.t);
    if (l.who === 'system' || l.who === 'bot')
      return `<div class="sys${sel.has(l.n) ? ' sel' : ''}" id="L${l.n}" data-n="${l.n}">${l.n}, ${time}. ${l.who === 'bot' ? 'Бот' : 'Система'}: ${esc(l.text)} ${tg}</div>`;
    return `<div class="msg ${l.who}${sel.has(l.n) ? ' sel' : ''}" id="L${l.n}" data-n="${l.n}">
      <header><span>${l.n}</span><b>${l.who === 'client' ? 'Клиент' : 'Оператор'}</b><span>${time}</span>
      ${d.ch === 'call' ? `<button type="button" class="mini" data-act="seek" data-n="${l.n}" aria-label="Слушать реплику ${l.n} с ${mmss(l.s)}" title="Слушать с ${mmss(l.s)}">▶</button>` : ''}${tg}</header>${esc(l.text)}</div>`;
  }).join('');
}

function critHTML(d, c, open) {
  const r = d.res[c.id], a = ans(d, c.id), isOpen = open === c.id;
  let chip, pts;
  if (c.type === 'flag') {
    const on = r && r.a && Object.values(r.a).some(Boolean);
    chip = !r ? '<span class="chip c-ev">ждёт оценки</span>' : on ? '<span class="chip c-risk">Да</span>' : '<span class="chip c-ok">Нет</span>';
    pts = 'без баллов';
  } else { chip = `<span class="chip ${tone(c, a)}">${esc(ansTxt(c, a))}</span>`; pts = c.type === 'flag' ? '' : ptsTxt(c, a); }
  return `<article class="crit${isOpen ? ' open' : ''}" data-cid="${c.id}" data-ev="${(r && r.ev || []).join(',')}">
    <button type="button" class="crit-row" data-act="crit" data-cid="${c.id}" aria-expanded="${isOpen}">
      <span class="muted small">${c.id}</span><span>${esc(c.name)}</span>${chip}<span class="num small" style="font-weight:600">${pts}</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    ${isOpen ? `<div class="crit-body">${critBody(d, c, r, a)}</div>` : ''}</article>`;
}

function critBody(d, c, r, a) {
  if (!r || a === 'pending') return `<div class="box ev">Критерий изменён в чек-листе v${S.cl.version}. Ответ появится после оценки: один вызов модели на диалог. Пока итог считается без него.</div>`;
  const evs = (r.ev || []).map(n => { const l = lineBy(d, n); if (!l) return '';
    return `<div class="quote"><div><span class="muted xs">${n}, ${l.who === 'client' ? 'клиент' : l.who === 'operator' ? 'оператор' : l.who === 'bot' ? 'бот' : 'система'}</span><br>«${esc(l.text)}»</div>
      <button type="button" class="btn sm" data-act="ev" data-n="${n}">К реплике</button>${d.ch === 'call' && l.s != null ? `<button type="button" class="btn sm" data-act="seek" data-n="${n}" aria-label="Слушать с ${mmss(l.s)}">▶ ${mmss(l.s)}</button>` : ''}</div>`; }).join('');
  if (c.type === 'flag') {
    return `<div class="stack small">${c.questions.map(q => `<div class="row" style="justify-content:space-between"><span>${esc(q.label)}</span>${r.a[q.k] ? '<b style="color:var(--risk)">найдено</b>' : '<span class="muted">нет</span>'}</div>`).join('')}</div>
      <p>${esc(r.why)}</p>${evs ? `<div class="stack"><span class="label">Основание</span>${evs}</div>` : ''}`;
  }
  const dec = lastDec(d.id, c.id), pa = pendAppeal(d.id, c.id);
  const vals = allowed(c).filter(v => v !== 'na' || a === 'na' || r.alt === 'na');
  let out = `<div class="stack" style="gap:6px"><div class="ladder" role="img" aria-label="Ответ ${esc(ansTxt(c, a))}${r.alt !== undefined && r.alt !== r.a ? `, второе мнение ${esc(ansTxt(c, r.alt))}` : ''}">
    ${vals.map(v => `<span class="step${v === a ? ' on' : ''}${r.alt !== undefined && v === r.alt && r.alt !== a ? ' alt' : ''}">${v === 'yes' ? 'Да' : v === 'no' ? 'Нет' : v === 'na' ? 'N/A' : v}</span>`).join('')}</div>
    ${c.type === 'scale' && c.stepText && c.stepText[a] ? `<span class="muted xs">${a}: ${esc(c.stepText[a])}</span>` : ''}</div>`;
  if (a === 'na') out += `<div class="box na"><b>Условие N/A выполнено.</b> ${esc(c.naCond || '')} ${esc(r.why)} Вес ${c.w} распределён между применимыми критериями.</div>`;
  else out += `<div><span class="label">Обоснование</span><p>${esc(r.why)}</p></div>`;
  if (a === 'no' && r.seg) out += `<p class="small">Проверен участок: <b>${esc(r.seg)}</b>. Ожидаемого действия там нет.</p>`;
  if (evs) out += `<div class="stack" style="gap:6px"><span class="label">Основание</span>${evs}</div>`;
  if (r.evFail && !dec) out += `<div class="box ev"><b>Цитата не нашлась в указанной реплике</b> и после повтора. Основание не подставлено, ответ нужно проверить вручную.</div>`;
  if (r.alt !== undefined) {
    if (r.alt !== r.a && !dec) out += `<div class="box info stack" style="gap:8px"><span><b>Второе мнение: ${esc(ansTxt(c, r.alt))}.</b> Модели разошлись, ответ ждёт решения специалиста.</span>
      <span class="row only-qa"><button type="button" class="btn sm" data-act="decide" data-cid="${c.id}" data-val="${r.a}">Оставить ${esc(ansTxt(c, r.a))}</button><button type="button" class="btn sm" data-act="decide" data-cid="${c.id}" data-val="${r.alt}">Принять ${esc(ansTxt(c, r.alt))}</button></span></div>`;
    else if (r.alt === r.a) out += `<p class="muted xs">Второе мнение совпало: ${esc(ansTxt(c, r.alt))}.</p>`;
  }
  if (r.better && frac(c, a) != null && frac(c, a) < 1) out += `<div class="box good"><b>Как сказать лучше:</b> «${esc(r.better)}»</div>`;
  const hist = S.ap.filter(x => x.dlg === d.id && x.cid === c.id && x.status !== 'pending');
  if (hist.length) out += `<div class="stack" style="gap:6px"><span class="label">История оценки</span><div class="hist">
    <span class="muted">Исходная</span><span>Модель, ${esc(d.at)}</span><span class="chip c-na">${esc(ansTxt(c, r.a))}</span>
    ${hist.map(h => `<span class="muted">${h.kind === 'appeal' ? 'Апелляция' : 'Решение'}</span><span>${esc(h.reviewer)}, ${esc(h.decidedAt)}: «${esc(h.reason)}»</span><span class="chip ${h.status === 'changed' ? 'c-info' : 'c-ok'}">${h.status === 'changed' ? esc(ansTxt(c, h.to)) : 'подтверждено'}</span>`).join('')}
    <span class="muted">Итог</span><span>Пересчитан по формуле чек-листа</span><b>${f2(calc(d).total)}</b></div></div>`;
  out += pa ? `<p><span class="chip c-info">Апелляция на рассмотрении</span> <a href="#/appeals/${pa.id}" class="small">Открыть</a></p>`
            : `<div class="no-rv"><button type="button" class="btn" data-act="appeal" data-cid="${c.id}">Оспорить оценку</button></div>`;
  return out;
}

/* плеер: в макете нет звука, время идёт по таймеру. В рабочей версии <audio> берёт свежую ссылку на запись через сервер. */
function playerHTML(d, c) {
  const N = 150; let bars = '';
  for (let i = 0; i < N; i++) {
    const t = (i + .5) / N * d.dur;
    const l = d.lines.find(x => x.fold ? (t >= x.t0 && t < x.t1) : ((x.who === 'client' || x.who === 'operator') && t >= x.s && t <= x.e + .8));
    const cls = !l ? 'ws' : l.fold ? 'wi' : l.who === 'client' ? 'wc' : 'wo';
    const rr = Math.abs(Math.sin(i * 1.93) * Math.cos(i * .41)) * .8 + ((i * 37) % 11) / 55;
    const h = cls === 'ws' ? 4 : cls === 'wi' ? 6 + Math.round(rr * 18) : 12 + Math.round(rr * 50);
    bars += `<span class="${cls}" style="height:${h}px"></span>`;
  }
  const folds = d.lines.filter(x => x.fold && x.t1 - x.t0 > 30).map(x => { const l = 100 * x.t0 / d.dur, w = 100 * (x.t1 - x.t0) / d.dur;
    return `<div class="hatch" style="left:${l}%;width:${w}%"></div><div class="hatchlbl" style="left:${l}%;width:${w}%;text-align:center">${esc(x.label)}, не оценивается</div>`; }).join('');
  const pins = c.losses.slice(0, 3).map((r, k) => { const rr = d.res[r.c.id]; const ln = rr && rr.ev && lineBy(d, rr.ev[0]); if (!ln) return '';
    return `<button type="button" class="pin" style="left:${100 * ln.s / d.dur}%" data-act="pin" data-cid="${r.c.id}" aria-label="Потеря ${k + 1}: ${esc(r.c.name)}, ${mmss(ln.s)}">${k + 1}</button>`; }).join('');
  const ticks = []; for (let m = 0; m * 60 < d.dur; m++) ticks.push(m * 60);
  return `<section class="card pad player" aria-label="Запись звонка">
    <div class="row" style="justify-content:space-between">
      <div class="row">
        <button type="button" class="btn pri" id="pbtn" data-act="play" aria-label="Слушать" style="width:44px;padding:0;border-radius:50%">▶</button>
        <button type="button" class="btn sm" data-act="skip" data-s="-5">−5 с</button>
        <button type="button" class="btn sm" data-act="skip" data-s="5">+5 с</button>
        <button type="button" class="btn sm" data-act="rate" id="prate">1×</button>
        <span><b id="ptime">00:00</b> / ${mmss(d.dur)}</span><span class="muted small" id="pnow"></span>
      </div>
      <div class="legend"><span><i style="background:#9AA8A1"></i>Клиент</span><span><i style="background:var(--accent)"></i>Оператор</span><span><i style="background:#D5DBD8"></i>Не оценивается</span><span><i style="background:var(--ev);border-radius:50%"></i>Потеря баллов</span></div>
    </div>
    <div class="wave">${folds}<div class="bars" data-act="wave" title="Перейти к моменту записи">${bars}</div><div class="playhead" id="phead" style="left:0"></div>${pins}</div>
    <div class="ruler" aria-hidden="true">${ticks.map(t => `<span style="left:${100 * t / d.dur}%">${mmss(t)}</span>`).join('')}<span style="left:100%">${mmss(d.dur)}</span></div>
    <p class="muted xs">Запись монофоническая: участки окрашены по ролям из расшифровки. Начало реплики считаем от метки конца по длине текста.</p>
  </section>`;
}
let timer = null;
const curD = () => S.r && S.r.page === 'd' ? dlgById(S.r.id) : null;
function stopPlay() { S.play.on = false; clearInterval(timer); timer = null; }
function seek(t) { const d = curD(); if (!d || d.ch !== 'call') return; S.play.t = Math.max(0, Math.min(d.dur, t)); updatePlayer(); }
function togglePlay() {
  const d = curD(); if (!d) return;
  if (S.play.on) { stopPlay(); updatePlayer(); return; }
  if (S.play.t >= d.dur) S.play.t = 0;
  S.play.on = true;
  timer = setInterval(() => { S.play.t += .25 * S.play.rate; if (S.play.t >= d.dur) { S.play.t = d.dur; stopPlay(); } updatePlayer(); }, 250);
  updatePlayer();
}
function updatePlayer() {
  const d = curD(); if (!d || d.ch !== 'call' || !$('#phead')) return;
  const t = S.play.t;
  $('#phead').style.left = `${100 * t / d.dur}%`;
  $('#ptime').textContent = mmss(t);
  $('#pbtn').textContent = S.play.on ? '❚❚' : '▶';
  $('#pbtn').setAttribute('aria-label', S.play.on ? 'Пауза' : 'Слушать');
  $('#prate').textContent = `${S.play.rate}×`;
  const cur = d.lines.find(l => !l.fold && l.s != null && t >= l.s && t <= l.e + .5 && (l.who === 'client' || l.who === 'operator'));
  $$('.msg.now').forEach(e => e.classList.remove('now'));
  if (cur) { const el = $('#L' + cur.n); if (el) el.classList.add('now'); }
  $('#pnow').textContent = cur ? `звучит реплика ${cur.n}` : '';
}
function flashLine(n) {
  const el = $('#L' + n); if (!el) return false;
  el.scrollIntoView({block:'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  return true;
}

/* ---------- 3. Апелляции ---------- */
function appeals(id) {
  const list = S.ap.filter(a => a.kind === 'appeal');
  const pend = list.filter(a => a.status === 'pending'), done = list.filter(a => a.status !== 'pending');
  const a = S.ap.find(x => x.id === id) || pend[0] || done[0];
  const item = x => { const c = crit(x.cid), d = dlgById(x.dlg);
    return `<a class="qitem" href="#/appeals/${x.id}" aria-current="${a && x.id === a.id}"><span class="row" style="justify-content:space-between"><b>${esc(titleOf(d))}</b><span class="muted xs">${esc(x.at)}</span></span>
      <span class="small">${x.cid} ${esc(c ? c.name : '')}</span><span class="muted xs">${esc(ansTxt(c, x.from))} → просят ${esc(ansTxt(c, x.ask))}${x.status !== 'pending' ? (x.status === 'changed' ? ', изменена' : ', подтверждена') : ''}</span></a>`; };
  const decided = S.ap.filter(x => x.status === 'changed' || x.status === 'confirmed').slice().sort((x, y) => (y.decidedAt || '').localeCompare(x.decidedAt || ''));
  return `
  <div class="head"><div><h1 class="h1">Апелляции</h1><p class="sub">Спорная оценка, довод и фрагмент разговора на одном экране</p></div></div>
  <div class="split">
    <aside class="card" style="padding:8px" aria-label="Очередь апелляций">
      <p class="label" style="padding:6px 12px">Ждут решения: ${pend.length}</p>${pend.map(item).join('') || '<p class="muted small" style="padding:0 12px 8px">Очередь пуста.</p>'}
      <p class="label" style="padding:14px 12px 6px">Решённые: ${done.length}</p>${done.map(item).join('')}
    </aside>
    <div class="stack" style="gap:14px">${a ? appealDetail(a) : '<div class="card empty">Апелляций пока нет. Оспорить оценку можно в карточке разговора.</div>'}
      <section class="card pad" aria-label="История решений"><h2 class="h2" style="margin-bottom:12px">История решений</h2><div class="timeline">
        ${decided.map(x => { const c = crit(x.cid), d = dlgById(x.dlg); return `<div class="ev"><i class="${x.status === 'changed' ? '' : 'k'}"></i><div>
          <b>${esc(titleOf(d))}, ${x.cid}: ${x.status === 'changed' ? `${esc(ansTxt(c, x.from))} → ${esc(ansTxt(c, x.to))}` : 'оценка подтверждена'}</b>
          <p class="muted small">${esc(x.reviewer)}, ${esc(x.decidedAt)}. ${esc(x.reason)}</p></div></div>`; }).join('') || '<p class="muted small">Решений пока нет.</p>'}
      </div></section>
    </div>
  </div>`;
}
function appealDetail(a) {
  const d = dlgById(a.dlg), c = crit(a.cid), r = d.res[a.cid] || {};
  if (!c) return `<div class="card empty">Критерий ${a.cid} удалён из чек-листа. Апелляция закрыта без решения.</div>`;
  const st = S.dec[a.id] = S.dec[a.id] || {mode:'change', val:a.ask, reason:''};
  const before = calc(d).total, after = calc(d, {cid:a.cid, val: st.mode === 'confirm' ? a.from : st.val}).total;
  const nset = new Set([...(r.ev || []), ...(a.ev || [])]);
  let frag = '<p class="muted small">Расшифровка этого диалога не входит в учебный макет.</p>';
  if (d.lines) {
    const ns = [...nset].sort((x, y) => x - y), lo = Math.min(...ns) - 2, hi = Math.max(...((r.ev && r.ev.length) ? r.ev : ns)) + 1;
    frag = d.lines.filter(l => !l.fold && ((l.n >= lo && l.n <= hi) || (a.ev || []).includes(l.n))).map(l => {
      const m = (r.ev || []).includes(l.n), ap = (a.ev || []).includes(l.n);
      return `<div class="quote" style="${m ? 'background:var(--ev-soft);border-color:var(--ev-line)' : ap ? 'background:var(--info-soft);border-color:var(--info-line)' : ''}"><div><span class="muted xs">${l.n}, ${l.who === 'client' ? 'клиент' : l.who === 'operator' ? 'оператор' : 'система'}${m ? ', основание модели' : ''}${ap ? ', довод оспаривающего' : ''}</span><br>${esc(l.text)}</div>
        ${d.ch === 'call' ? `<a class="btn sm" href="#/d/${encodeURIComponent(d.id)}">▶ ${mmss(l.s)}</a>` : ''}</div>`; }).join('');
  }
  const decided = a.status !== 'pending';
  return `<section class="card pad stack" style="gap:14px" aria-label="Рассмотрение">
    <div class="row" style="justify-content:space-between"><div><h2 class="h2">${esc(titleOf(d))}, ${c.id} ${esc(c.name)}</h2>
      <p class="muted small">Подал: ${esc(a.by)}, ${esc(a.at)}. Вес критерия ${c.w}. <a href="#/d/${encodeURIComponent(d.id)}">Открыть карточку</a></p></div>
      <span class="chip ${decided ? (a.status === 'changed' ? 'c-info' : 'c-ok') : 'c-ev'}">${decided ? (a.status === 'changed' ? 'Оценка изменена' : 'Оценка подтверждена') : 'Ждёт решения'}</span></div>
    <div class="compare">
      <div><span class="label">Оценка модели</span><strong>${esc(ansTxt(c, a.from))}</strong><span class="small">${esc(r.why || '')}</span>${r.alt !== undefined ? `<span class="small" style="color:var(--info)">Второе мнение: ${esc(ansTxt(c, r.alt))}</span>` : ''}</div>
      <div><span class="label">Просит оспаривающий</span><strong>${esc(ansTxt(c, a.ask))}</strong><span class="small">«${esc(a.comment)}»</span></div>
    </div>
    <div class="stack" style="gap:6px"><span class="label">Фрагмент разговора</span>${frag}</div>
    ${decided ? `<div class="box ${a.status === 'changed' ? 'info' : 'good'}"><b>${esc(a.reviewer)}, ${esc(a.decidedAt)}:</b> ${esc(a.reason)}</div>` : `
    <p class="only-rv-note box na">Решение принимает проверяющий. Переключите роль вверху страницы, чтобы показать этот шаг.</p>
    <fieldset class="only-rv stack" style="gap:14px;border-top:1px solid var(--line2);padding-top:14px">
      <legend class="h2" style="margin-bottom:10px">Решение проверяющего</legend>
      <div class="row">
        <label class="opt"><input type="radio" name="dm" value="confirm" data-act="dmode" ${st.mode === 'confirm' ? 'checked' : ''}>Подтвердить оценку модели</label>
        <label class="opt"><input type="radio" name="dm" value="change" data-act="dmode" ${st.mode === 'change' ? 'checked' : ''}>Изменить оценку</label>
      </div>
      ${st.mode === 'change' ? `<div class="stack" style="gap:6px"><span class="field"><span>Новый ответ</span></span><div class="ladder" role="group" aria-label="Новый ответ">
        ${allowed(c).map(v => `<button type="button" class="step" data-act="dval" data-v="${v}" aria-pressed="${v === st.val}">${v === 'yes' ? 'Да' : v === 'no' ? 'Нет' : v === 'na' ? 'N/A' : v}</button>`).join('')}</div>
        ${c.type === 'scale' && c.stepText && c.stepText[st.val] ? `<span class="muted xs">${st.val}: ${esc(c.stepText[st.val])}</span>` : ''}
        <span class="muted xs">Доступны только ступени шкалы${c.na ? ' и N/A, он разрешён у этого критерия' : ''}.</span></div>` : ''}
      <label class="field"><span>Причина решения, обязательно</span><textarea id="decReason" class="fld" placeholder="Например: регламент не позволяет называть срок, следующий шаг дан полностью">${esc(st.reason)}</textarea></label>
      <div class="row" style="justify-content:space-between;border-top:1px solid var(--line2);padding-top:12px">
        <span>Итог разговора: <s class="muted">${f2(before)}</s> → <b style="font-size:20px">${f2(after)}</b></span>
        <button type="button" class="btn pri" id="decSave" data-act="dsave" data-id="${a.id}" ${st.reason.trim().length < 5 ? 'disabled' : ''}>Сохранить решение</button>
      </div>
    </fieldset>`}
  </section>`;
}

/* ---------- 4. Аналитика ---------- */
function analytics() {
  const ds = S.ds, cs = scored(), langs = ['RU', 'KZ', 'EN'];
  const st = cs.map(c => {
    const xs = ds.map(d => ({d, a:ans(d, c.id)}));
    const app = xs.filter(x => frac(c, x.a) != null);
    const lost = app.filter(x => frac(c, x.a) < 1);
    const val = !app.length ? null : c.type === 'scale' ? app.reduce((s, x) => s + x.a, 0) / app.length : 100 * app.filter(x => x.a === 'yes').length / app.length;
    return {c, n:app.length, na:xs.filter(x => x.a === 'na').length, pend:xs.filter(x => x.a === 'pending').length, lost:lost.length, share: app.length ? lost.length / app.length : null, val,
      by: langs.map(Lg => { const a2 = app.filter(x => x.d.lang === Lg); return {n:a2.length, lost:a2.filter(x => frac(c, x.a) < 1).length}; })};
  });
  const reasons = {};
  for (const d of ds) for (const c of cs) { const r = d.res[c.id]; const f = frac(c, ans(d, c.id)); if (!r || !r.tag || f == null || f >= 1) continue;
    const g = reasons[r.tag] = reasons[r.tag] || {tag:r.tag, ds:new Set(), cs:new Set(), langs:new Set()}; g.ds.add(d.id); g.cs.add(c.id); g.langs.add(d.lang); }
  const rs = Object.values(reasons).sort((a, b) => b.ds.size - a.ds.size);
  const fl = flagCs()[0];
  const fcount = fl ? fl.questions.map(q => ({q, n:ds.filter(d => d.res[fl.id] && d.res[fl.id].a[q.k]).length})) : [];
  const flagged = ds.filter(d => flagsOf(d).length);
  const dev = st.filter(x => x.n >= 3 && x.share != null).sort((a, b) => b.share - a.share)[0];
  const alts = []; for (const d of ds) for (const c of cs) { const r = d.res[c.id]; if (r) alts.push(r.alt === undefined || r.alt === r.a); }
  const decided = S.ap.filter(a => a.kind === 'appeal' && a.status !== 'pending');
  const maxR = rs.length ? rs[0].ds.size : 1;
  const rsRep = rs.filter(g => g.ds.size > 1), single = rs.length - rsRep.length;
  const pct = x => x == null ? '—' : `${Math.round(100 * x)}%`;
  const hcls = (k, n) => !n ? 'hm0' : k / n >= .6 ? 'hm4' : k / n >= .4 ? 'hm3' : k / n >= .2 ? 'hm2' : k ? 'hm1' : 'hm0';
  const nextN = ds.filter(nextStep).length;
  return `
  <div class="head"><div><h1 class="h1">Аналитика</h1><p class="sub">Каждое число открывает список диалогов, из него карточку и реплику</p></div>
    <span class="muted small">Набор DEV в макете: ${ds.length} диалогов. RU ${ds.filter(d => d.lang === 'RU').length}, KZ ${ds.filter(d => d.lang === 'KZ').length}, EN ${ds.filter(d => d.lang === 'EN').length}</span></div>
  <section class="lens" aria-label="Что получает бизнес">
    <a class="card" href="#/queue" data-act="grp" data-g="next"><span class="label">Качество сервиса</span><strong>${nextN}</strong><span>${nextN === 1 ? 'запрос остался' : 'запросов остались'} без решения или понятного следующего шага</span></a>
    <a class="card" href="#/queue" data-act="grp" data-g="risk"><span class="label">Контроль рисков</span><strong>${flagged.length}</strong><span>разговоров с грубыми ошибками, проверено ${flagged.filter(d => d.reviewed).length}</span></a>
    <a class="card" href="#/coaching"><span class="label">Развитие сотрудников</span><strong>${dev ? pct(dev.share) : '—'}</strong><span>${dev ? `применимых разговоров теряют баллы на критерии «${esc(dev.c.name)}»` : 'мало данных'}</span></a>
    <a class="card" href="#reasons"><span class="label">Улучшение процессов</span><strong>${rs[0] ? rs[0].ds.size : 0}</strong><span>${rs[0] ? `разговоров с одной причиной: ${esc(rs[0].tag.toLowerCase())}` : 'повторяющихся причин нет'}</span></a>
  </section>

  <section class="card" aria-label="Результат по критериям">
    <div class="pad" style="padding-bottom:6px"><h2 class="h2">Результат по критериям</h2>
      <p class="muted small">Доля считается среди применимых оценок, N/A показан отдельно. Где применимых меньше пяти, выводы ненадёжны.</p></div>
    <div class="tablewrap"><table style="min-width:820px"><thead><tr><th>Критерий</th><th class="num">Вес</th><th class="num">Применимо</th><th class="num">N/A</th><th class="num">Результат</th><th>Теряют баллы</th><th></th></tr></thead><tbody>
      ${st.map(x => `<tr class="click" data-act="crfilter" data-cid="${x.c.id}"><td><span class="muted">${x.c.id}</span> ${esc(x.c.name)}</td><td class="num">${x.c.w}</td><td class="num">${x.n}</td><td class="num">${x.na}</td>
        <td class="num">${x.val == null ? '—' : x.c.type === 'scale' ? `${fn(x.val)} из ${maxOf(x.c)}` : `${Math.round(x.val)}% «Да»`}</td>
        <td><span class="hbar" style="width:${x.share == null ? 0 : Math.max(2, 140 * x.share)}px"></span> <span class="small">${x.lost} из ${x.n}</span></td>
        <td>${x.pend ? '<span class="chip c-ev">ждёт оценки</span>' : x.n < 5 ? '<span class="chip c-na">мало данных</span>' : ''}</td></tr>`).join('')}
    </tbody></table></div>
  </section>

  <div class="two">
    <section class="card pad stack" aria-label="Критерий и язык">
      <div><h2 class="h2">Критерий и язык</h2><p class="muted small">Сколько применимых разговоров потеряли баллы. В ячейке число, а не только процент: на малых выборках процент обманчив.</p></div>
      <div class="tablewrap"><table><thead><tr><th>Критерий</th>${langs.map(Lg => `<th class="num">${Lg}</th>`).join('')}</tr></thead><tbody>
        ${st.map(x => `<tr><td><span class="muted">${x.c.id}</span> ${esc(x.c.name)}</td>${x.by.map(b => `<td style="width:84px;padding:4px"><div class="heat ${hcls(b.lost, b.n)}">${b.n ? `${b.lost} из ${b.n}` : '—'}</div></td>`).join('')}</tr>`).join('')}
      </tbody></table></div>
      <div class="row xs muted"><span>Светлее — реже теряют</span><span style="display:inline-flex;gap:2px"><i class="heat hm1" style="width:24px;min-height:12px"></i><i class="heat hm2" style="width:24px;min-height:12px"></i><i class="heat hm3" style="width:24px;min-height:12px"></i><i class="heat hm4" style="width:24px;min-height:12px"></i></span><span>темнее — чаще</span></div>
    </section>
    <section class="card pad stack" aria-label="Грубые ошибки и качество оценки">
      <h2 class="h2">Грубые ошибки по видам</h2>
      ${fcount.map(x => `<div class="row" style="justify-content:space-between"><span>${esc(x.q.label)}</span><span><span class="hbar" style="background:var(--risk);width:${(flagged.length ? 120 * x.n / flagged.length : 0)}px"></span> <b>${x.n}</b></span></div>`).join('')}
      <p class="muted xs">Флаг не входит в итог. Все такие разговоры стоят первыми в очереди, пока специалист их не проверит.</p>
      <h2 class="h2" style="margin-top:8px">Качество самой оценки</h2>
      <div class="grid2"><div><strong style="font-size:24px">${alts.length ? Math.round(100 * alts.filter(Boolean).length / alts.length) : '—'}%</strong><p class="muted small">ответов двух моделей совпали (${alts.filter(Boolean).length} из ${alts.length})</p></div>
        <div><strong style="font-size:24px">${decided.filter(a => a.status === 'changed').length} из ${decided.length}</strong><p class="muted small">решённых апелляций изменили оценку</p></div></div>
      <p class="muted xs">Тренда по неделям нет: в данных нет дат. После 11:00 здесь же сравниваем наборы DEV и контрольный.</p>
    </section>
  </div>

  <section class="card" id="reasons" aria-label="Повторяющиеся причины">
    <div class="pad row" style="justify-content:space-between;padding-bottom:6px"><div><h2 class="h2">Повторяющиеся причины</h2><p class="muted small">Причины снижения сгруппированы по смыслу. Кому их исправлять, решает человек.</p></div>
      <button type="button" class="btn sm" data-act="csv">Скачать CSV</button></div>
    <div class="tablewrap"><table style="min-width:820px"><thead><tr><th>Причина</th><th>Разговоров</th><th>Критерии</th><th>Языки</th><th>Что менять</th><th>Примеры</th></tr></thead><tbody>
      ${rsRep.map((g, k) => `<tr><td style="font-weight:600">${esc(g.tag)}</td><td><span class="hbar" style="width:${80 * g.ds.size / maxR}px"></span> <b>${g.ds.size}</b></td><td>${[...g.cs].join(', ')}</td><td>${[...g.langs].join(', ')}</td>
        <td><label class="sr" for="own${k}">Что менять: ${esc(g.tag)}</label><select id="own${k}" class="fld" data-owner="${esc(g.tag)}">${['Не назначено', 'Инструкция', 'Сервис', 'Продукт'].map(o => `<option ${(S.owners[g.tag] || 'Не назначено') === o ? 'selected' : ''}>${o}</option>`).join('')}</select></td>
        <td class="small">${[...g.ds].slice(0, 3).map(id => `<a href="#/d/${encodeURIComponent(id)}">${esc(titleOf(dlgById(id)))}</a>`).join(', ')}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">Повторяющихся причин нет.</td></tr>'}
    </tbody></table></div>
    ${single ? `<p class="muted small pad">Ещё ${single} причин встретились по одному разу. Они видны в карточках и в разделе «Обучение».</p>` : ''}
  </section>`;
}

/* ---------- 5. Обучение ---------- */
function coaching() {
  const items = [];
  for (const d of S.ds) for (const c of scored()) { const r = d.res[c.id]; const f = frac(c, ans(d, c.id)); if (r && r.better && f != null && f < 1) items.push({key:d.id + '|' + c.id, d, c, r}); }
  const byC = {}; items.forEach(x => (byC[x.c.id] = byC[x.c.id] || []).push(x));
  const ids = Object.keys(byC).sort((a, b) => byC[b].length - byC[a].length);
  if (!S.coachC || !byC[S.coachC]) S.coachC = ids[0];
  const sel = byC[S.coachC] || [];
  const goodC = crit(S.coachC);
  const good = goodC ? S.ds.flatMap(d => { const r = d.res[goodC.id]; if (!r || !r.ev || frac(goodC, ans(d, goodC.id)) !== 1 || !d.lines) return [];
    return r.ev.map(n => lineBy(d, n)).filter(l => l && l.who === 'operator').map(l => ({d, l})); }) : [];
  const sheet = items.filter(x => S.sheet.has(x.key));
  return `
  <div class="head"><div><h1 class="h1">Обучение</h1><p class="sub">Обратная связь на конкретных репликах из наших разговоров</p></div>
    <a class="btn pri no-print" href="#sheet">Разбор для встречи: ${sheet.length}</a></div>
  <div class="seg no-print" role="group" aria-label="Критерий" style="align-self:flex-start;flex-wrap:wrap">
    ${ids.map(id => `<button type="button" data-act="coach" data-cid="${id}" aria-pressed="${id === S.coachC}">${id} ${esc(crit(id).name)}: ${byC[id].length}</button>`).join('')}</div>
  <div class="cols no-print">
    <section class="stack" aria-label="Где теряем баллы"><h2 class="h2">Где теряем баллы</h2>
      ${sel.map(x => { const l = x.r.ev && lineBy(x.d, x.r.ev.find(n => (lineBy(x.d, n) || {}).who === 'operator') || x.r.ev[0]);
        return `<article class="card pad stack">
          <div class="row" style="justify-content:space-between"><span class="small"><a href="#/d/${encodeURIComponent(x.d.id)}">${esc(titleOf(x.d))}</a>, ${LANG[x.d.lang]}</span><span class="chip ${tone(x.c, ans(x.d, x.c.id))}">${esc(ansTxt(x.c, ans(x.d, x.c.id)))}</span></div>
          ${l ? `<p style="font-size:15px">«${esc(l.text)}»</p>` : ''}
          <p class="small"><b>Что не так:</b> ${esc(x.r.why)}</p>
          <div class="box good"><b>Как сказать лучше:</b> «${esc(x.r.better)}»</div>
          <label class="row small" style="gap:8px"><input type="checkbox" data-pick="${esc(x.key)}" ${S.sheet.has(x.key) ? 'checked' : ''}>Добавить в разбор</label>
        </article>`; }).join('') || '<div class="card empty">По этому критерию подсказок нет.</div>'}
    </section>
    <section class="stack" aria-label="Как звучит хороший ответ"><h2 class="h2">Как звучит хороший ответ</h2>
      ${good.slice(0, 3).map(g => `<article class="card pad stack"><div class="row" style="justify-content:space-between"><span class="small"><a href="#/d/${encodeURIComponent(g.d.id)}">${esc(titleOf(g.d))}</a></span><span class="chip c-ok">полный балл</span></div><p style="font-size:15px">«${esc(g.l.text)}»</p></article>`).join('')
        || `<div class="card pad muted">В наборе пока нет ответа с полным баллом и цитатой по критерию «${esc(goodC ? goodC.name : '')}». Примеры появятся, когда модели согласятся на полном балле.</div>`}
    </section>
  </div>
  <section class="card pad stack" id="sheet" aria-label="Разбор для встречи с оператором">
    <div class="row" style="justify-content:space-between"><h2 class="h2">Разбор для встречи с оператором</h2>
      <div class="row no-print"><button type="button" class="btn" data-act="copy" ${sheet.length ? '' : 'disabled'}>Скопировать текст</button><button type="button" class="btn" data-act="print" ${sheet.length ? '' : 'disabled'}>Печать</button></div></div>
    ${sheet.length ? `<ol class="stack" style="padding-left:20px;margin:0">${sheet.map(x => `<li><b>${esc(titleOf(x.d))}, ${esc(x.c.name)}.</b> ${esc(x.r.why)} Лучше: «${esc(x.r.better)}»</li>`).join('')}</ol>`
      : '<p class="muted">Отметьте моменты выше, и они соберутся в один лист для встречи.</p>'}
  </section>`;
}

/* ---------- 6. Чек-лист ---------- */
const SIGNALS = [['', 'Нет'], ['resolution', 'Решение запроса'], ['risk', 'Риск']];
function checklist() {
  if (!S.draft) S.draft = clone(S.cl);
  const dr = S.draft;
  const c = dr.criteria.find(x => x.id === S.cSel) || dr.criteria[0];
  if (c) S.cSel = c.id;
  const sum = scored(dr).reduce((s, x) => s + (Number(x.w) || 0), 0);
  const dirty = JSON.stringify(dr) !== JSON.stringify(S.cl);
  const pendIds = scored().filter(x => S.ds.some(d => !d.res[x.id])).map(x => x.id);
  const changed = id => { const o = S.cl.criteria.find(x => x.id === id), n = dr.criteria.find(x => x.id === id); return !o || JSON.stringify(o) !== JSON.stringify(n); };
  const typeName = {bool:'Да/Нет', scale:'Шкала', flag:'Флаг'};
  return `
  <div class="head"><div><h1 class="h1">Чек-лист качества</h1><p class="sub">Версия ${S.cl.version} применяется к набору. Изменения сохраняются новой версией.</p></div>
    <div class="row only-qa">${dirty ? '<span class="chip c-ev">Есть несохранённые изменения</span>' : ''}
      <button type="button" class="btn" data-act="creset" ${dirty ? '' : 'disabled'}>Отменить изменения</button>
      <button type="button" class="btn pri" data-act="csave" ${dirty ? '' : 'disabled'}>Сохранить как v${S.cl.version + 1}</button></div></div>
  ${pendIds.length ? `<section class="card pad row" style="justify-content:space-between;background:var(--ev-soft);border-color:var(--ev-line)">
    <span>Критерии ${pendIds.join(', ')} ждут оценки: <b>${pendIds.length * S.ds.length} вызовов</b> основной модели, около ${Math.max(10, pendIds.length * 45 * S.ds.length / 65 | 0)} с, около $${fn(pendIds.length * S.ds.length * 0.0012)}. Остальные ответы берутся из кэша.</span>
    <button type="button" class="btn pri only-qa" data-act="crun" ${S.running ? 'disabled' : ''}>${S.running ? 'Идёт оценка…' : 'Оценить набор'}</button></section>` : ''}
  <div class="split" style="grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr)">
    <section class="card" style="padding:10px" aria-label="Структура чек-листа">
      ${dr.sections.map((s, si) => { const cs = dr.criteria.filter(x => x.sec === si); return `<p class="label row" style="justify-content:space-between;padding:8px 10px 4px"><span>${esc(s)}</span><span>${scored(dr).filter(x => x.sec === si).reduce((a, x) => a + (Number(x.w) || 0), 0) || ''}</span></p><div class="clist">
        ${cs.map(x => `<button type="button" class="citem" data-act="csel" data-cid="${x.id}" aria-current="${x.id === S.cSel}"><span class="muted small">${x.id}</span><span>${esc(x.name)}${changed(x.id) ? ' <span class="chip c-ev">изменён</span>' : ''}${x.signal ? ` <span class="chip c-info">${esc(SIGNALS.find(s => s[0] === x.signal)[1])}</span>` : ''}</span><span class="muted xs">${typeName[x.type]}${x.na ? ', N/A' : ''}</span><b class="num">${x.type === 'flag' ? '—' : x.w}</b></button>`).join('')}</div>`; }).join('')}
      <div class="row" style="padding:12px 10px 4px;border-top:1px solid var(--line2);margin-top:8px">
        <span class="chip ${sum === 100 ? 'c-ok' : 'c-ev'}">Сумма весов ${sum}</span>${sum !== 100 ? '<span class="muted xs">Итог всё равно приводится к 100</span>' : ''}
        <button type="button" class="btn sm only-qa" data-act="cadd" style="margin-left:auto">Добавить критерий</button></div>
      <div class="stack small" style="padding:12px 10px 4px;gap:4px"><span class="label">Версии</span>${S.versions.slice().reverse().map(v => `<span>v${v.v}: ${esc(v.note)}${v.v === S.cl.version ? ' <span class="chip c-ok">применяется</span>' : ''}</span>`).join('')}</div>
    </section>
    ${c ? `<section class="card pad" aria-label="Редактор критерия"><fieldset class="stack" style="gap:16px" ${S.role === 'qa' ? '' : 'disabled'}>
      <legend class="row" style="justify-content:space-between;width:100%;margin-bottom:12px"><span class="h2">Критерий ${c.id}</span>${S.role !== 'qa' ? '<span class="chip c-na">Только просмотр: редактирует специалист КК</span>' : ''}</legend>
      <div class="grid2">
        <label class="field"><span>Название</span><input id="cf-name" class="fld" data-cf="name" value="${esc(c.name)}"></label>
        <label class="field"><span>Секция</span><select id="cf-sec" class="fld" data-cf="sec">${dr.sections.map((s, i) => `<option value="${i}" ${c.sec === i ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select></label>
      </div>
      <label class="field"><span>Что проверяем</span><textarea id="cf-text" class="fld" data-cf="text">${esc(c.text)}</textarea><span class="muted xs">Этот текст модель получает дословно. Названий критериев нет ни в коде, ни в промпте.</span></label>
      <div class="grid2">
        <label class="field"><span>Тип ответа</span><select id="cf-type" class="fld" data-cf="type">${[['bool', 'Да / Нет'], ['scale', 'Шкала'], ['flag', 'Флаг нарушения, без баллов']].map(([v, t]) => `<option value="${v}" ${c.type === v ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
        ${c.type !== 'flag' ? `<label class="field"><span>Вес</span><input id="cf-w" class="fld" type="number" min="0" max="100" data-cf="w" value="${c.w}"></label>` : '<span></span>'}
      </div>
      ${c.type !== 'flag' ? `<div class="stack box na" style="gap:8px"><label class="row" style="gap:8px;font-weight:600"><input id="cf-na" type="checkbox" data-cf="na" ${c.na ? 'checked' : ''}>N/A разрешён</label>
        ${c.na ? `<label class="field"><span>Условие N/A</span><input id="cf-nac" class="fld" data-cf="naCond" value="${esc(c.naCond || '')}"></label>` : ''}</div>` : ''}
      ${c.type === 'scale' ? `<label class="field"><span>Ступени шкалы, по строке на ступень: «балл: что значит»</span><textarea id="cf-steps" class="fld" data-cf="steps" style="min-height:130px">${esc((c.steps || []).map(s => `${s}: ${(c.stepText || {})[s] || ''}`).join('\n'))}</textarea><span class="muted xs">Верхняя ступень даёт полный вес, остальные пропорционально.</span></label>` : ''}
      ${c.type === 'flag' ? `<label class="field"><span>Подвопросы, по строке на вид нарушения</span><textarea id="cf-q" class="fld" data-cf="questions">${esc((c.questions || []).map(q => q.label).join('\n'))}</textarea><span class="muted xs">Каждый подвопрос идёт к модели отдельно. Флаг ставится, если выполнен хотя бы один.</span></label>` : ''}
      <label class="field"><span>Сигнал для списка и аналитики</span><select id="cf-sig" class="fld" data-cf="signal">${SIGNALS.map(([v, t]) => `<option value="${v}" ${(c.signal || '') === v ? 'selected' : ''}>${t}</option>`).join('')}</select>
        <span class="muted xs">Метка «Без следующего шага» и плитки аналитики строятся по сигналу, а не по номеру критерия, поэтому замена критерия их не ломает.</span></label>
      <div class="row only-qa" style="justify-content:space-between;border-top:1px solid var(--line2);padding-top:14px">
        <span class="muted small">Смена веса пересчитывает итоги сразу. Смена текста, типа, шкалы или N/A требует новой оценки этого критерия.</span>
        <button type="button" class="btn" data-act="cdel">Удалить критерий</button></div>
    </fieldset></section>` : '<section class="card empty">Критериев нет. Добавьте первый.</section>'}
  </div>`;
}
function saveChecklist() {
  const old = S.cl, dr = S.draft, pend = [], light = [];
  const sem = x => JSON.stringify([x.text, x.type, x.steps, x.na, x.naCond, x.questions]);
  for (const c of dr.criteria) { const o = old.criteria.find(x => x.id === c.id);
    if (!o || sem(o) !== sem(c)) pend.push(c.id); else if (JSON.stringify(o) !== JSON.stringify(c)) light.push(c.id); }
  const removed = old.criteria.filter(o => !dr.criteria.some(c => c.id === o.id)).map(o => o.id);
  dr.version = old.version + 1;
  S.versions.push({v:dr.version, note:[pend.length ? `изменены ${pend.join(', ')}` : '', light.length ? `веса или названия ${light.join(', ')}` : '', removed.length ? `удалены ${removed.join(', ')}` : ''].filter(Boolean).join('; ')});
  for (const id of pend) for (const d of S.ds) delete d.res[id];
  S.ap.forEach(a => { if (pend.includes(a.cid) || removed.includes(a.cid)) { if (a.status === 'pending') a.status = 'closed'; } });
  S.cl = clone(dr); S.draft = null;
  toast(pend.length ? `Сохранена версия v${dr.version}. Критерии ${pend.join(', ')} ждут оценки: ${pend.length * S.ds.length} вызовов.` : `Сохранена версия v${dr.version}. Итоги пересчитаны без вызова модели.`);
}

/* ---------- окно: подача апелляции и решение по расхождению ---------- */
const dlg = $('#dlg'), dlgForm = $('#dlgForm');
let dlgCtx = null;
function openAppeal(d, cid) {
  dlgCtx = {mode:'appeal', d};
  const cs = scored().filter(c => d.res[c.id] && !pendAppeal(d.id, c.id));
  const fill = id => { const c = crit(id), a = ans(d, id);
    return {now:`Сейчас: <b>${esc(ansTxt(c, a))}</b>. ${esc((d.res[id] || {}).why || '')}`, opts: allowed(c).filter(v => v !== a).map(v => `<option value="${v}">${esc(ansTxt(c, v))}</option>`).join('')}; };
  const f = fill(cid);
  dlgForm.innerHTML = `<header><h2 class="h2" id="dlgTitle">Оспорить оценку</h2><p class="muted small">${esc(titleOf(d))}, роль: ${ROLE[S.role]}</p></header>
    <label class="field"><span>Критерий</span><select name="cid" class="fld" id="dCid">${cs.map(c => `<option value="${c.id}" ${c.id === cid ? 'selected' : ''}>${c.id} ${esc(c.name)}</option>`).join('')}</select></label>
    <p class="box na" id="dNow">${f.now}</p>
    <label class="field"><span>Какой ответ вы считаете верным</span><select name="ask" class="fld" id="dAsk">${f.opts}</select></label>
    <label class="field"><span>Комментарий, обязательно</span><textarea name="comment" class="fld" required minlength="10" placeholder="Почему оценка неверна, со ссылкой на реплику"></textarea></label>
    ${d.lines ? `<label class="field"><span>Реплика в подтверждение</span><select name="ev" class="fld"><option value="">Не выбрана</option>${d.lines.filter(l => !l.fold && l.who !== 'system').map(l => `<option value="${l.n}">${l.n}: ${esc(l.text.slice(0, 60))}${l.text.length > 60 ? '…' : ''}</option>`).join('')}</select></label>` : ''}
    <p class="muted small">Апелляцию рассмотрит проверяющий. Исходная оценка сохранится, решение и новый итог появятся в карточке рядом с ней.</p>
    <footer><button class="btn" value="cancel" formnovalidate>Отмена</button><button class="btn pri" value="ok">Отправить апелляцию</button></footer>`;
  dlgCtx.fill = fill;
  dlg.showModal();
}
function openDecide(d, cid, val) {
  const c = crit(cid), r = d.res[cid];
  dlgCtx = {mode:'decide', d, cid, val};
  const keep = val === r.a;
  dlgForm.innerHTML = `<header><h2 class="h2" id="dlgTitle">${keep ? 'Оставить оценку модели' : 'Принять второе мнение'}</h2><p class="muted small">${esc(titleOf(d))}, ${c.id} ${esc(c.name)}</p></header>
    <p class="box na">${keep ? `Оценка остаётся <b>${esc(ansTxt(c, val))}</b>.` : `Оценка меняется с <b>${esc(ansTxt(c, r.a))}</b> на <b>${esc(ansTxt(c, val))}</b>.`} Итог: ${f2(calc(d).total)} → <b>${f2(calc(d, {cid, val}).total)}</b></p>
    <label class="field"><span>Причина решения, обязательно</span><textarea name="reason" class="fld" required minlength="5" placeholder="Что в разговоре подтверждает этот ответ"></textarea></label>
    <footer><button class="btn" value="cancel" formnovalidate>Отмена</button><button class="btn pri" value="ok">Сохранить решение</button></footer>`;
  dlg.showModal();
}
dlgForm.addEventListener('change', e => {
  if (e.target.id === 'dCid' && dlgCtx && dlgCtx.fill) { const f = dlgCtx.fill(e.target.value); $('#dNow').innerHTML = f.now; $('#dAsk').innerHTML = f.opts; }
});
dlg.addEventListener('close', () => {
  if (dlg.returnValue !== 'ok' || !dlgCtx) return;
  const fd = new FormData(dlgForm), d = dlgCtx.d;
  if (dlgCtx.mode === 'appeal') {
    const cid = fd.get('cid'), c = crit(cid);
    S.ap.push({id:'a' + Date.now(), kind:'appeal', dlg:d.id, cid, from:ans(d, cid), ask:parseVal(fd.get('ask')), ev: fd.get('ev') ? [Number(fd.get('ev'))] : [], by: S.role === 'operator' ? 'Оператор' : 'Специалист КК', at:now(), status:'pending', comment:fd.get('comment')});
    toast(`Апелляция по критерию «${c.name}» отправлена проверяющему.`);
  } else {
    const r = d.res[dlgCtx.cid];
    S.ap.push({id:'r' + Date.now(), kind:'review', dlg:d.id, cid:dlgCtx.cid, from:r.a, to:dlgCtx.val, status: dlgCtx.val === r.a ? 'confirmed' : 'changed', reviewer:'Специалист КК', reason:fd.get('reason'), decidedAt:now(), at:now(), by:'Специалист КК'});
    toast(`Решение сохранено. Итог ${f2(calc(d).total)}.`);
  }
  dlgCtx = null; render();
});

/* ---------- события ---------- */
const A = {
  role: t => { S.role = t.dataset.role; app.dataset.role = S.role; render(); toast(`Роль: ${ROLE[S.role]}.`); },
  grp: (t, e) => { if (t.tagName === 'A') { e.preventDefault(); } S.grp = S.grp === t.dataset.g && S.r.page === 'queue' ? '' : t.dataset.g; if (S.r.page !== 'queue') location.hash = '#/queue'; else render(); },
  clear: () => { S.grp = S.q = S.lang = S.ch = ''; render(); },
  open: (t, e) => { if (e.target.closest('a')) return; location.hash = '#/d/' + encodeURIComponent(t.dataset.id); },
  load: () => toast(`Набор «${$('#gid').value}» запрашивается через сервер: прямой запрос из браузера блокирует CORS. В макете уже загружен DEV.`),
  crit: t => { const id = S.r.id; S.open[id] = S.open[id] === t.dataset.cid ? null : t.dataset.cid; render(); },
  goto: t => { const d = curD(); S.open[d.id] = t.dataset.cid; render(); const r = d.res[t.dataset.cid]; if (r && r.ev && r.ev.length) { flashLine(r.ev[0]); const l = lineBy(d, r.ev[0]); if (l && l.s != null) seek(l.s); } },
  ev: t => flashLine(Number(t.dataset.n)),
  seek: t => { const d = curD(); const l = lineBy(d, Number(t.dataset.n)); if (!l) return; seek(l.s); flashLine(l.n); if (!S.play.on) togglePlay(); },
  pin: t => { const d = curD(); S.open[d.id] = t.dataset.cid; render(); const r = d.res[t.dataset.cid]; const l = lineBy(d, r.ev[0]); seek(l.s); flashLine(l.n); },
  play: () => togglePlay(),
  skip: t => seek(S.play.t + Number(t.dataset.s)),
  rate: () => { S.play.rate = S.play.rate === 1 ? 1.5 : S.play.rate === 1.5 ? 2 : 1; updatePlayer(); if (S.play.on) { stopPlay(); togglePlay(); } },
  wave: (t, e) => { const d = curD(); const b = t.getBoundingClientRect(); seek((e.clientX - b.left) / b.width * d.dur); },
  reviewed: () => { const d = curD(); d.reviewed = !d.reviewed; render(); toast(d.reviewed ? `${titleOf(d)} отмечен проверенным и уходит из верхних групп очереди.` : 'Отметка снята.'); },
  appeal: t => openAppeal(curD(), t.dataset.cid),
  decide: t => openDecide(curD(), t.dataset.cid, parseVal(t.dataset.val)),
  dmode: t => { const a = parse().id || S.ap.find(x => x.status === 'pending')?.id; const id = $('#decSave') && $('#decSave').dataset.id; if (!id) return; S.dec[id].mode = t.value; render(); },
  dval: t => { const id = $('#decSave').dataset.id; S.dec[id].val = parseVal(t.dataset.v); render(); },
  dsave: t => { const a = S.ap.find(x => x.id === t.dataset.id), st = S.dec[a.id], d = dlgById(a.dlg); const before = calc(d).total;
    a.to = st.mode === 'confirm' ? a.from : st.val; a.status = a.to === a.from ? 'confirmed' : 'changed'; a.reason = st.reason.trim(); a.reviewer = 'Проверяющий'; a.decidedAt = now();
    render(); toast(`Решение сохранено. Итог ${titleOf(d)}: ${f2(before)} → ${f2(calc(d).total)}.`); },
  crfilter: () => { location.hash = '#/queue'; },
  csv: () => { const rows = [['Причина', 'Разговоров', 'Критерии', 'Языки', 'Что менять', 'Диалоги']];
    $$('#reasons tbody tr').forEach(tr => { const td = tr.querySelectorAll('td'); if (td.length < 6) return; rows.push([td[0].textContent, td[1].textContent.trim(), td[2].textContent, td[3].textContent, td[4].querySelector('select').value, td[5].textContent]); });
    const blob = new Blob(['﻿' + rows.map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(';')).join('\n')], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'cqa-reasons.csv'; a.click(); URL.revokeObjectURL(a.href); },
  coach: t => { S.coachC = t.dataset.cid; render(); },
  copy: () => { navigator.clipboard.writeText($('#sheet ol').innerText).then(() => toast('Текст разбора скопирован.'), () => toast('Браузер не дал доступа к буферу обмена. Выделите текст вручную.')); },
  print: () => window.print(),
  csel: t => { S.cSel = t.dataset.cid; render(); },
  cadd: () => { const ids = S.draft.criteria.map(c => Number(c.id)).filter(Boolean); const id = String(Math.max(0, ...ids) + 1).padStart(2, '0');
    S.draft.criteria.push({id, sec:Math.max(0, S.draft.sections.length - 2), name:'Новый критерий', type:'bool', w:5, na:false, text:'Да — …'}); S.cSel = id; render(); },
  cdel: () => { S.draft.criteria = S.draft.criteria.filter(c => c.id !== S.cSel); S.cSel = S.draft.criteria[0] && S.draft.criteria[0].id; render(); },
  creset: () => { S.draft = null; render(); },
  csave: () => { saveChecklist(); render(); },
  crun: () => { S.running = true; render(); setTimeout(() => { S.running = false; render(); toast('Учебный макет не вызывает модель. В рабочей версии ответы появляются по мере готовности, итоги пересчитываются сами.'); }, 1400); }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || (t.tagName === 'INPUT' && t.dataset.act !== 'dmode')) return;
  const f = A[t.dataset.act]; if (f) f(t, e);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.q = t.value; render(); }
  else if (t.id === 'decReason') { const id = $('#decSave').dataset.id; S.dec[id].reason = t.value; $('#decSave').disabled = t.value.trim().length < 5; }
  else if (t.dataset.cf && t.type !== 'checkbox' && t.tagName !== 'SELECT') setField(t);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'fl') { S.lang = t.value; render(); }
  else if (t.id === 'fc') { S.ch = t.value; render(); }
  else if (t.dataset.owner) S.owners[t.dataset.owner] = t.value;
  else if (t.dataset.pick) { t.checked ? S.sheet.add(t.dataset.pick) : S.sheet.delete(t.dataset.pick); render(); }
  else if (t.dataset.cf) setField(t);
  else if (t.id === 'jsonf' && t.files[0]) t.files[0].text().then(txt => { try { const j = JSON.parse(txt); const n = (j.data && j.data.records || j.records || []).length; toast(n ? `В файле ${n} диалогов. В рабочей версии они уходят на оценку.` : 'В файле нет поля records: ожидается формат ответа API организаторов.'); } catch (err) { toast('Файл не читается как JSON. Проверьте, что это выгрузка API организаторов.'); } });
});
function setField(t) {
  const c = S.draft.criteria.find(x => x.id === S.cSel), k = t.dataset.cf;
  if (k === 'w') c.w = Number(t.value) || 0;
  else if (k === 'sec') c.sec = Number(t.value);
  else if (k === 'na') c.na = t.checked;
  else if (k === 'signal') { if (t.value) c.signal = t.value; else delete c.signal; }
  else if (k === 'type') { c.type = t.value;
    if (c.type === 'scale' && !c.steps) { c.steps = [10, 5, 0]; c.stepText = {10:'Полностью', 5:'Частично', 0:'Нет'}; }
    if (c.type === 'flag' && !c.questions) c.questions = [{k:'q1', label:'Нарушение'}]; }
  else if (k === 'steps') { const lines = t.value.split('\n').map(s => s.match(/^\s*(\d+)\s*[:—-]?\s*(.*)$/)).filter(Boolean);
    if (lines.length) { c.steps = lines.map(m => Number(m[1])).sort((a, b) => b - a); c.stepText = Object.fromEntries(lines.map(m => [Number(m[1]), m[2]])); } }
  else if (k === 'questions') c.questions = t.value.split('\n').map(s => s.trim()).filter(Boolean).map((label, i) => ({k:(c.questions[i] && c.questions[i].k) || 'q' + i, label}));
  else c[k] = t.value;
  render(); // кнопки «Сохранить» и сумма весов должны видеть каждое изменение
}
// подсветка реплик при наведении или фокусе на критерии
let hov = null;
const hl = el => { $$('.hl').forEach(x => x.classList.remove('hl')); if (el && el.dataset.ev) el.dataset.ev.split(',').filter(Boolean).forEach(n => { const l = $('#L' + n); if (l) l.classList.add('hl'); }); };
view.addEventListener('mouseover', e => { const c = e.target.closest('.crit'); if (c !== hov) { hov = c; hl(c); } });
view.addEventListener('focusin', e => { const c = e.target.closest('.crit'); if (c !== hov) { hov = c; hl(c); } });
// J и K — соседний диалог в очереди
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,select,dialog') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (S.r && S.r.page === 'd' && (e.key === 'j' || e.key === 'k' || e.key === 'о' || e.key === 'л')) {
    const ord = queueOrder(), i = ord.indexOf(S.r.id), n = ord[i + (e.key === 'j' || e.key === 'о' ? 1 : -1)];
    if (n) location.hash = '#/d/' + encodeURIComponent(n);
  }
});

/* ---------- самопроверка расчёта: пример из чек-листа и звонок 024 ---------- */
(function selfCheck() {
  const ex = {id:'x', res:{'01':{a:'yes'},'02':{a:'na'},'03':{a:'na'},'04':{a:15},'05':{a:'yes'},'06':{a:7},'07':{a:'no'}}};
  console.assert(calc(ex, null, CL0).total === 77.69, 'пример из чек-листа должен давать 77,69');
  console.assert(calc(D[0], null, CL0).total === 82.94, 'звонок 024 должен давать 82,94');
  const c = calc(D[0], null, CL0);
  console.assert(Math.abs(c.losses.reduce((s, r) => s + r.loss, 0) - (100 - c.total)) < 0.01, 'потери в сумме дают 100 − итог');
})();

if (!location.hash) history.replaceState(null, '', '#/queue');
render();
})();
</script>
