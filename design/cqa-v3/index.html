<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>CQA — контроль качества диалогов</title>
<style>
:root{
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --bg:#F3F5F4;--surface:#fff;--hover:#F1F4F2;
  --line:#E0E6E3;--line2:#ECF0EE;--line-strong:#C9D1CD;
  --ink:#17201C;--ink2:#34413B;--muted:#56635D;
  --accent:#0E6A55;--accent-ink:#0A4C3D;--accent-soft:#E2F1EB;
  --ev:#B4560C;--ev-line:#E39B3A;--ev-soft:#FFF3E3;
  --risk:#B42318;--risk-soft:#FDEEEB;
  --info:#1849A9;--info-line:#4A7BD6;--info-soft:#EAF1FF;
  --na:#475467;--na-soft:#EEF1F2;
  --r:10px;--shadow:0 1px 2px rgba(23,32,28,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
a:hover{color:var(--accent-ink)}
:focus-visible{outline:3px solid #2E7DD1;outline-offset:2px}
h1,h2,h3,p{margin:0}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.num{text-align:right;white-space:nowrap}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}

/* каркас */
.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:2px 10px 16px}
.brand i{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px}
.brand b{display:block;font-size:15px}
.brand span{font-size:12px;color:var(--muted)}
.navgroup{font-size:12px;font-weight:600;color:var(--muted);padding:14px 12px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--ink2);text-decoration:none;font-weight:500;min-height:40px}
.nav a:hover{background:var(--hover);color:var(--ink)}
.nav a[aria-current=page]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{margin-left:auto;min-width:22px;text-align:center;font-size:12px;font-weight:600;border-radius:999px;padding:0 7px;background:var(--risk);color:#fff}
.badge:empty{display:none}
.sidefoot{margin-top:auto;border-top:1px solid var(--line);padding:12px 12px 0;font-size:12px;color:var(--muted);display:grid;gap:2px}
.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 28px;min-height:58px;flex-wrap:wrap}
.crumb{font-size:13px;color:var(--muted)}
.crumb b{color:var(--ink);font-weight:600}
.demo{font-size:12px;font-weight:600;color:#7A3A06;background:var(--ev-soft);border-radius:999px;padding:3px 10px}
.content{padding:22px 28px 56px;max-width:1480px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.content:focus{outline:none}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
.sub{margin-top:2px;color:var(--muted)}
.h2{font-size:16px;font-weight:650}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px 18px}
.label{font-size:13px;font-weight:600;color:var(--muted)}

/* элементы */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--hover);color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-ink)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:0 12px;min-height:36px;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.fld{min-height:40px;border:1px solid var(--line-strong);border-radius:8px;padding:0 10px;background:var(--surface)}
textarea.fld{padding:8px 10px;min-height:88px;width:100%;resize:vertical;line-height:1.5}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:13px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:1px 9px;border-radius:999px;white-space:nowrap;line-height:20px;border:0}
button.chip{cursor:pointer}
.c-risk{background:var(--risk-soft);color:var(--risk)}
.c-ev{background:var(--ev-soft);color:#8A3A0B}
.c-info{background:var(--info-soft);color:var(--info)}
.c-ok{background:var(--accent-soft);color:var(--accent-ink)}
.c-na{background:var(--na-soft);color:var(--na)}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--hover)}
tr.grp td{background:#F7F9F8;font-weight:600;font-size:13px;padding:9px 12px}
.tablewrap{overflow-x:auto}
.empty{padding:28px;text-align:center;color:var(--muted)}
.box{border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.5}
.box.info{background:var(--info-soft);color:#12387F}
.box.good{background:var(--accent-soft);color:var(--accent-ink)}
.box.ev{background:var(--ev-soft);color:#5E2A08}
.box.na{background:var(--na-soft);color:#344054}
.box.risk{background:var(--risk-soft);color:#7A1A12}

/* список */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:2px;padding:14px 16px;text-align:left;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);text-decoration:none;color:var(--ink)}
.tile:hover{border-color:var(--line-strong);color:var(--ink)}
.tile[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tile strong{font-size:28px;line-height:1.15;font-weight:700}
.tile .t{font-size:13px;font-weight:600}
.runbar{height:6px;border-radius:3px;background:var(--accent-soft);overflow:hidden}
.runbar i{display:block;height:100%;background:var(--accent)}

/* карточка */
.sum{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr);gap:14px}
.ring{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.kv{display:flex;justify-content:space-between;gap:12px}
.msg .chip,.sys .chip{background:#fff;box-shadow:inset 0 0 0 1px currentColor}
.secs{display:grid;gap:8px;font-size:13px;flex:1 1 170px}
.secs b{white-space:nowrap}
.secs div{display:flex;justify-content:space-between;gap:8px}
.loss{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px;border-radius:8px;cursor:pointer;text-align:left;background:none;border:0;width:100%}
.loss:hover{background:var(--ev-soft)}
.loss em{font-style:normal;color:var(--risk);font-weight:700}
.pinno{width:22px;height:22px;border-radius:50%;background:var(--ev);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.player{display:flex;flex-direction:column;gap:10px}
.wave{position:relative;padding-top:26px}
.bars{display:flex;align-items:center;gap:2px;height:72px;cursor:pointer}
.bars span{flex:1;border-radius:2px;min-width:2px}
.wc{background:#9AA8A1}.wo{background:var(--accent)}.wi{background:#D5DBD8}.ws{background:#E6EAE8}
.hatch{position:absolute;top:26px;height:72px;border-radius:6px;background:repeating-linear-gradient(135deg,rgba(86,99,93,.06) 0 6px,rgba(86,99,93,.13) 6px 12px);pointer-events:none}
.hatchlbl{position:absolute;top:2px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin{position:absolute;top:0;transform:translateX(-50%);width:24px;height:24px;border-radius:50%;background:var(--ev);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25);cursor:pointer;padding:0}
.playhead{position:absolute;top:22px;bottom:0;width:2px;background:var(--ink);pointer-events:none}
.ruler{position:relative;height:18px;font-size:12px;color:var(--muted)}
.ruler span{position:absolute;transform:translateX(-50%)}
.ruler span:first-child{transform:none}.ruler span:last-child{transform:translateX(-100%)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:start}
.tr{display:flex;flex-direction:column;gap:10px;padding:14px}
.msg{max-width:86%;padding:8px 12px;border-radius:12px;transition:box-shadow .15s,background .15s}
.msg.client{align-self:flex-start;background:#EEF2F0;border-bottom-left-radius:4px}
.msg.operator{align-self:flex-end;background:var(--accent-soft);border-bottom-right-radius:4px}
.msg header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:2px}
.msg header b{color:var(--ink2)}
.msg.sel{background:var(--ev-soft);box-shadow:0 0 0 2px var(--ev-line)}
.msg.hl,.sys.hl{box-shadow:0 0 0 2px var(--info-line)}
.msg.now{box-shadow:0 0 0 2px var(--ink)}
.sys{align-self:center;max-width:90%;font-size:12px;color:var(--muted);text-align:center;padding:2px 8px;border-radius:8px}
.sys.sel{background:var(--ev-soft);box-shadow:0 0 0 2px var(--ev-line)}
.fold{align-self:stretch;border:1px dashed var(--line-strong);border-radius:8px;padding:8px 12px;font-size:13px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.mini{border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer;padding:0 4px;font-size:12px}
.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 8px rgba(227,155,58,.55)}100%{box-shadow:0 0 0 2px var(--ev-line)}}
.crit{border-top:1px solid var(--line2)}
.crit.open{background:#FFFBF4}
.crit-row{width:100%;display:grid;grid-template-columns:24px minmax(0,1fr) auto 76px 14px;gap:10px;align-items:center;padding:10px 14px;background:none;border:0;text-align:left;cursor:pointer}
.crit-row:hover{background:var(--hover)}
.crit-row svg{width:14px;height:14px;fill:none;stroke:var(--muted);stroke-width:2;transition:transform .15s}
.crit.open .crit-row svg{transform:rotate(180deg)}
.crit-body{padding:2px 14px 16px 48px;display:flex;flex-direction:column;gap:12px}
.sechead{display:flex;justify-content:space-between;padding:9px 14px;background:#F7F9F8;border-top:1px solid var(--line2);font-size:13px;font-weight:600;color:var(--ink2)}
.ladder{display:flex;gap:6px;flex-wrap:wrap}
.step{min-width:44px;min-height:32px;border:1px solid var(--line-strong);border-radius:7px;display:grid;place-items:center;font-weight:600;font-size:13px;color:var(--ink2);background:var(--surface);padding:0 8px}
.step.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.step.alt{box-shadow:inset 0 0 0 2px var(--info-line);color:var(--info)}
button.step{cursor:pointer;min-height:40px}
button.step[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.quote{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.quote>div{flex:1;min-width:0}
.hist{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:6px 12px;font-size:13px;align-items:baseline}

/* апелляции */
.split{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
.qitem{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:8px;text-decoration:none;color:var(--ink)}
.qitem:hover{background:var(--hover);color:var(--ink)}
.qitem[aria-current=true]{background:var(--accent-soft)}
.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.compare>div{background:#F7F9F8;border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.compare strong{font-size:20px}
.opt{display:flex;gap:10px;align-items:center;padding:10px 14px;border:1px solid var(--line-strong);border-radius:8px;cursor:pointer;flex:1;min-width:220px}
.opt:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.timeline{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:14px minmax(0,1fr);gap:12px;padding-bottom:16px;position:relative}
.ev:before{content:"";position:absolute;left:6px;top:14px;bottom:0;width:1px;background:var(--line)}
.ev:last-child:before{display:none}
.ev i{width:13px;height:13px;border-radius:50%;margin-top:4px;background:var(--accent)}
.ev i.k{background:var(--na)}

/* аналитика */
.lens{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.lens a{display:flex;flex-direction:column;gap:6px;padding:16px 18px;text-decoration:none;color:var(--ink)}
.lens a:hover{border-color:var(--line-strong);color:var(--ink)}
.lens strong{font-size:30px;line-height:1.1}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.hbar{display:inline-block;height:10px;border-radius:0 3px 3px 0;background:var(--ev);vertical-align:middle}
.heat{display:grid;place-items:center;min-height:36px;border-radius:4px;font-weight:600;font-size:13px}
.hm0{background:#F7F9F8;color:var(--muted)}.hm1{background:#FFF1E2}.hm2{background:#FBD6AA}.hm3{background:#F0A964}.hm4{background:#A84F14;color:#fff}

/* чек-лист */
.clist{display:flex;flex-direction:column;gap:2px}
.citem{display:grid;grid-template-columns:24px minmax(0,1fr) auto 30px;gap:8px;align-items:center;padding:9px 10px;border-radius:8px;background:none;border:0;text-align:left;cursor:pointer;width:100%}
.citem:hover{background:var(--hover)}
.citem[aria-current=true]{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
fieldset{border:0;margin:0;padding:0;min-width:0}

/* диалог и уведомление */
dialog{border:0;border-radius:12px;padding:0;width:min(520px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(23,32,28,.25)}
dialog::backdrop{background:rgba(23,32,28,.35)}
dialog form{display:flex;flex-direction:column;gap:16px;padding:20px 22px}
dialog footer{display:flex;gap:10px;justify-content:flex-end;padding-top:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;max-width:min(560px,calc(100vw - 32px));box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:20;font-size:14px}

/* роли: что кому показывать */
.app[data-role=operator] .only-qa,.app[data-role=operator] .only-rv,
.app[data-role=reviewer] .only-qa,.app[data-role=reviewer] .no-rv,
.app[data-role=qa] .only-rv{display:none!important}
.app:not([data-role=reviewer]) .only-rv-note{display:block}
.only-rv-note{display:none}

@media (max-width:1100px){
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .sum,.lens{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols,.split,.two{grid-template-columns:1fr}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:6px 8px;border-right:0;border-bottom:1px solid var(--line)}
  .brand,.navgroup,.sidefoot{display:none}
  .nav{display:flex;gap:2px}
  .nav a{white-space:nowrap}
  .top{padding:8px 16px}
  .content{padding:16px 14px 40px}
  .tiles,.sum,.lens,.grid2,.compare{grid-template-columns:1fr}
  .msg{max-width:100%}
  .crit-body{padding-left:14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{.side,.top,.no-print{display:none!important}.app{display:block}body{background:#fff}.card{box-shadow:none}}
</style>
</head>
<body>
<!-- Весь интерфейс живёт в одном корневом элементе: в Dynamics 365 его можно отдать как HTML-ресурс,
     адрес API передаётся атрибутом data-api, маршруты держатся в адресе после #. -->
<div id="cqa-app" class="app" data-role="qa" data-api="/api">
  <aside class="side">
    <div class="brand"><i aria-hidden="true">CQ</i><div><b>CQA</b><span>Качество диалогов</span></div></div>
    <div class="navgroup">Работа</div>
    <nav class="nav" aria-label="Работа">
      <a href="#/queue" data-page="queue"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Диалоги<span class="badge" id="bQueue"></span></a>
      <a href="#/appeals" data-page="appeals"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M6 21h12M4 7h16M7 7l-3 7c1.5 1.3 4.5 1.3 6 0L7 7zM17 7l-3 7c1.5 1.3 4.5 1.3 6 0l-3-7z"/></svg>Апелляции<span class="badge" id="bAppeals"></span></a>
      <a href="#/coaching" data-page="coaching"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h14v15H6a2 2 0 0 0-2 2V5zM4 20a2 2 0 0 0 2 2h14v-4"/></svg>Обучение</a>
    </nav>
    <div class="navgroup">Обзор и настройка</div>
    <nav class="nav" aria-label="Обзор и настройка">
      <a href="#/analytics" data-page="analytics"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v16h16M9 16v-5M14 16V7M19 16v-3"/></svg>Аналитика</a>
      <a href="#/checklist" data-page="checklist"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m8 12 3 3 5-6"/></svg>Чек-лист</a>
    </nav>
    <div class="sidefoot"><span>Набор DEV, учебные данные</span><span id="clVer"></span></div>
  </aside>
  <div>
    <header class="top">
      <div class="crumb" id="crumb"></div>
      <div class="row">
        <span class="demo">Учебный макет: модель не вызывается</span>
        <span class="muted small" id="roleLbl">Роль</span>
        <div class="seg" role="group" aria-labelledby="roleLbl">
          <button type="button" data-act="role" data-role="qa" aria-pressed="true">Специалист КК</button>
          <button type="button" data-act="role" data-role="operator" aria-pressed="false">Оператор</button>
          <button type="button" data-act="role" data-role="reviewer" aria-pressed="false">Проверяющий</button>
        </div>
      </div>
    </header>
    <main id="view" class="content" tabindex="-1"></main>
  </div>
</div>
<dialog id="dlg" aria-labelledby="dlgTitle"><form method="dialog" id="dlgForm"></form></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(() => {
'use strict';

/* ---------- утилиты ---------- */

const lastDec = (dlg, cid) => S.ap.filter(a => a.dlg === dlg && a.cid === cid && (a.status === 'changed' || a.status === 'confirmed')).at(-1);
const pendAppeal = (dlg, cid) => S.ap.find(a => a.dlg === dlg && a.cid === cid && a.status === 'pending');

function ans(d, cid, ov) {
  if (ov && ov.cid === cid) return ov.val;
  const r = d.res[cid];
  if (!r) return 'pending';
  const dec = lastDec(d.id, cid);
  return dec && dec.status === 'changed' ? dec.to : r.a;
}
function frac(c, a) {
  if (a == null || a === 'na' || a === 'pending') return null;
  if (c.type === 'bool') return a === 'yes' ? 1 : 0;
  if (c.type === 'scale') return a / maxOf(c);
  return null;
}
// Итог = 100 × Σ(вес × доля) / Σ(вес применимых). N/A исключается, его вес перераспределяется.
function calc(d, ov, cl = S.cl) {
  let W = 0, G = 0, pending = 0; const rows = [];
  for (const c of scored(cl)) {
    const a = ans(d, c.id, ov);
    if (a === 'pending') { pending++; continue; }
    const f = frac(c, a);
    if (f == null) continue;
    W += c.w; G += c.w * f; rows.push({c, a, f});
  }
  for (const r of rows) r.loss = W ? 100 * r.c.w * (1 - r.f) / W : 0;
  const secs = cl.sections.map((name, i) => {
    const rs = rows.filter(r => r.c.sec === i);
    return {name, n: rs.length, w: rs.reduce((s, r) => s + r.c.w, 0), g: rs.reduce((s, r) => s + r.c.w * r.f, 0)};
  }).filter(s => s.n);
  return {total: W ? r2(100 * G / W) : null, W, G, rows, secs, pending, losses: rows.filter(r => r.loss > 0).sort((a, b) => b.loss - a.loss)};
}
function flagsOf(d) {
  const out = [];
  for (const fc of flagCs()) { const r = d.res[fc.id]; if (r && r.a) for (const q of fc.questions) if (r.a[q.k]) out.push(q.label); }
  return out;
}
const disagree = d => scored().filter(c => { const r = d.res[c.id]; return r && r.alt !== undefined && r.alt !== r.a && !lastDec(d.id, c.id); });
const evFail = d => scored().filter(c => { const r = d.res[c.id]; return r && r.evFail && !lastDec(d.id, c.id); });
const nextStep = d => scored().some(c => { if (c.signal !== 'resolution') return false; const f = frac(c, ans(d, c.id)); return f != null && f <= 0.25; });
function group(d) {
  if (flagsOf(d).length && !d.reviewed) return 'risk';
  if (!d.reviewed && (disagree(d).length || evFail(d).length)) return 'review';
  if (nextStep(d)) return 'next';
  return 'other';
}
const GORDER = {risk:0, review:1, next:2, other:3};
const queueOrder = () => S.ds.map(d => ({d, g:group(d), t:calc(d).total ?? 101})).sort((a, b) => GORDER[a.g] - GORDER[b.g] || a.t - b.t).map(x => x.d.id);
const ansTxt = (c, a) => a === 'pending' ? 'ждёт оценки' : a === 'na' ? 'N/A' : a === 'yes' ? 'Да' : a === 'no' ? 'Нет' : c.type === 'scale' ? `${a} из ${maxOf(c)}` : String(a);
function tone(c, a) {
  if (a === 'pending') return 'c-ev';
  if (a === 'na') return 'c-na';
  const f = frac(c, a);
  return f === 1 ? 'c-ok' : (c.type === 'bool' ? 'c-risk' : 'c-ev');
}
const ptsTxt = (c, a) => { const f = frac(c, a); return f == null ? '—' : `${fn(c.w * f)} / ${c.w}`; };
const allowed = c => c.type === 'bool' ? ['yes', 'no', ...(c.na ? ['na'] : [])] : [...c.steps, ...(c.na ? ['na'] : [])];
const parseVal = v => /^\d+$/.test(v) ? Number(v) : v;
const lineBy = (d, n) => (d.lines || []).find(l => l.n === n);
const titleOf = d => d.title || d.id;

/* ---------- маршруты и отрисовка ---------- */
const view = $('#view');
const app = $('#cqa-app');
function parse() { const h = location.hash.replace(/^#\/?/, '').split('/'); return {page: h[0] || 'queue', id: h[1] ? decodeURIComponent(h[1]) : null}; }

function render(focusView) {

  const names = {queue:'Диалоги', d:'Карточка разговора', appeals:'Апелляции', analytics:'Аналитика', coaching:'Обучение', checklist:'Чек-лист'};
  $('#crumb').innerHTML = `CQA / <b>${names[r.page] || 'Диалоги'}</b>`;

}

let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 5200); }

/* ---------- 1. Диалоги ---------- */
function reasonOf(d, g) {
  if (g === 'risk') return `<span class="chip c-risk">${esc(flagsOf(d).join(', '))}</span>`;
  if (g === 'review') {
    const dc = disagree(d)[0];
    if (dc) { const r = d.res[dc.id]; return `<span class="chip c-info">Модели разошлись: ${dc.id}, ${esc(ansTxt(dc, r.a))} и ${esc(ansTxt(dc, r.alt))}</span>`; }
    const ef = evFail(d)[0];
    return `<span class="chip c-ev">Цитата для ${ef.id} не найдена в реплике</span>`;
  }
  if (g === 'next') { const c = scored().find(c => c.signal === 'resolution'); return `<span class="chip c-ev">${esc(c.name.split(' ').slice(-1)[0].replace(/^./, s => s.toUpperCase()))}: ${esc(ansTxt(c, ans(d, c.id)))}</span>`; }
  return flagsOf(d).length ? `<span class="chip c-na">Грубая ошибка проверена</span>` : '';
}
function statusOf(d) {
  const c = calc(d);
  if (c.pending) return `<span class="chip c-ev">Ждёт оценки</span>`;
  if (S.ap.some(a => a.dlg === d.id && a.status === 'pending')) return `<span class="chip c-info">Апелляция</span>`;
  return d.reviewed ? `<span class="chip c-ok">Проверен</span>` : `<span class="chip c-na">Не проверен</span>`;
}
function queue() {
  const all = S.ds.map(d => ({d, c:calc(d), g:group(d)}));
  const cnt = k => all.filter(x => x.g === k).length;
  const totals = all.map(x => x.c.total).filter(x => x != null);
  const avg = totals.length ? r2(totals.reduce((a, b) => a + b, 0) / totals.length) : null;
  const pa = S.ap.filter(a => a.status === 'pending').length;
  const ql = S.q.trim().toLowerCase();
  const rows = all.filter(x => (!ql || (titleOf(x.d) + ' ' + (x.d.lines || []).map(l => l.text || '').join(' ')).toLowerCase().includes(ql))
    && (!S.lang || x.d.lang === S.lang) && (!S.ch || x.d.ch === S.ch) && (!S.grp || x.g === S.grp));
  const G = [['risk','Грубые ошибки','c-risk','флаг ставит любая из двух моделей, итог он не обнуляет'],
             ['review','Нужна проверка человека','c-info','модели разошлись или цитата не нашлась в реплике'],
             ['next','Без понятного следующего шага','c-ev','критерий с сигналом «Решение запроса» на нижних ступенях'],
             ['other','Остальные','c-na','']];
  const tile = (g, title, n, note) => `<button type="button" class="tile" data-act="grp" data-g="${g}" aria-pressed="${S.grp === g}"><span class="t">${title}</span><strong>${n}</strong><span class="muted small">${note}</span></button>`;
  const lost = c => c.losses.slice(0, 3).map(r => `${r.c.id} ${esc(ansTxt(r.c, r.a))}`).join(', ');
  let body = '';
  for (const [g, title, cls, hint] of G) {
    const rs = rows.filter(x => x.g === g).sort((a, b) => (a.c.total ?? 101) - (b.c.total ?? 101));
    if (!rs.length) continue;
    body += `<tbody><tr class="grp"><td colspan="6"><span class="chip ${cls}">${title}: ${rs.length}</span> <span class="muted" style="font-weight:400;margin-left:8px">${hint}</span></td></tr>`;
    body += rs.map(x => `<tr class="click" data-act="open" data-id="${esc(x.d.id)}">
      <td><a href="#/d/${encodeURIComponent(x.d.id)}" style="font-weight:600;text-decoration:none">${esc(titleOf(x.d))}</a></td>

      <td>${reasonOf(x.d, g)}</td>
      <td class="muted small">${lost(x.c) || '—'}</td>
      <td>${statusOf(x.d)}</td></tr>`).join('') + '</tbody>';
  }
  return `
  <div class="head"><div><h1 class="h1">Диалоги</h1><p class="sub">Сначала разговоры с нарушениями и спорными ответами модели</p></div>
    <div class="row only-qa">

    <div style="flex:1 1 320px" class="stack"><div class="row" style="justify-content:space-between"><span><b>${S.ds.length - all.filter(x => x.c.pending).length} из ${S.ds.length}</b> оценено по чек-листу v${S.cl.version}</span><span class="muted small">${S.ds.length * 10 + S.ds.length} вызовов, $${fn(S.ds.reduce((s, d) => s + COST[d.ch], 0))}</span></div>
    <div class="runbar"><i style="width:${100 * (S.ds.length - all.filter(x => x.c.pending).length) / S.ds.length}%"></i></div></div>
  </section>
  <section class="tiles" aria-label="Быстрые фильтры">
    ${tile('risk', 'Грубые ошибки', cnt('risk'), `ещё ${S.ds.filter(d => d.reviewed && flagsOf(d).length).length} проверено`)}
    ${tile('review', 'Нужна проверка', cnt('review'), 'модели разошлись или цитата не найдена')}
    ${tile('next', 'Без следующего шага', cnt('next'), 'клиент не знает, что делать дальше')}
    <a class="tile" href="#/appeals"><span class="t">Апелляции</span><strong>${pa}</strong><span class="muted small">ждут решения проверяющего</span></a>
    <a class="tile" href="#/analytics"><span class="t">Средний итог</span><strong>${f2(avg)}</strong><span class="muted small">по ${totals.length} диалогам, открыть аналитику</span></a>
  </section>
  <section class="card" aria-label="Список диалогов">
    <div class="row" style="padding:12px 14px;border-bottom:1px solid var(--line)">
      <label class="sr" for="q">Поиск</label><input id="q" class="fld" style="flex:1 1 220px" placeholder="Номер диалога или текст реплики" value="${esc(S.q)}">
      <label class="small muted" for="fl">Язык</label><select id="fl" class="fld">${['', 'RU', 'KZ', 'EN'].map(v => `<option value="${v}" ${S.lang === v ? 'selected' : ''}>${v || 'Все'}</option>`).join('')}</select>
      <label class="small muted" for="fc">Канал</label><select id="fc" class="fld">${[['', 'Все'], ['chat', 'Чат'], ['call', 'Звонок']].map(([v, t]) => `<option value="${v}" ${S.ch === v ? 'selected' : ''}>${t}</option>`).join('')}</select>
      ${S.grp || S.q || S.lang || S.ch ? `<button type="button" class="btn sm" data-act="clear">Сбросить фильтры</button>` : ''}
    </div>
    <div class="tablewrap"><table style="min-width:860px">
      <thead><tr><th>Диалог</th><th>Канал и язык</th><th class="num">Итог</th><th>Почему в очереди</th><th>Где потеряны баллы</th><th>Статус</th></tr></thead>
      ${body || `<tbody><tr><td colspan="6" class="empty">По этим фильтрам диалогов нет. Сбросьте фильтры, чтобы увидеть весь набор.</td></tr></tbody>`}
    </table></div>
  </section>
  <p class="muted xs">Клавиши J и K переходят между диалогами в карточке. Числа и реплики учебные.</p>`;
}

/* ---------- 2. Карточка ---------- */
function defaultOpen(d, c) {
  const dc = disagree(d)[0]; if (dc) return dc.id;
  return c.losses[0] ? c.losses[0].c.id : (flagsOf(d).length ? flagCs()[0].id : scored()[0].id);
}
function card(id) {
  const d = dlgById(id);
  if (!d) return `<div class="card empty">Диалог «${esc(id)}» не найден. <a href="#/queue">Вернуться к списку</a></div>`;
  if (S.play.id !== d.id) { stopPlay(); S.play = {id:d.id, t:0, on:false, rate:1}; }
  const c = calc(d);
  if (!(d.id in S.open)) S.open[d.id] = defaultOpen(d, c);
  const open = S.open[d.id];
  const ord = queueOrder(), i = ord.indexOf(d.id);
  const prev = ord[i - 1], next = ord[i + 1];
  const g = group(d);
  const C = 2 * Math.PI * 52, dash = c.total == null ? 0 : C * c.total / 100;
  const naRows = scored().filter(cr => ans(d, cr.id) === 'na');
  const flags = flagsOf(d);
  const altN = scored().filter(cr => d.res[cr.id] && ans(d, cr.id) !== 'pending').length;
  const fr = flagCs()[0], frr = fr && d.res[fr.id];
  const status = {risk:`<span class="chip c-risk">Грубая ошибка, нужна проверка</span>`, review:`<span class="chip c-info">Нужна проверка человека</span>`, next:`<span class="chip c-ev">Без следующего шага</span>`, other:''}[g];
  return `
  <nav class="row" aria-label="Навигация по очереди" style="justify-content:space-between">
    <a href="#/queue">Все диалоги</a>
    <div class="row small"><span class="muted">${i + 1} из ${ord.length} в очереди</span>
      ${prev ? `<a class="btn sm" href="#/d/${encodeURIComponent(prev)}" aria-label="Предыдущий диалог">Предыдущий</a>` : ''}

    <div class="row">${status}${d.reviewed ? '<span class="chip c-ok">Проверен</span>' : ''}

  </div>

  <section class="sum" aria-label="Сводка">
    <div class="card pad stack">
      <h2 class="label">Итог</h2>
      <div class="ring">
        <svg width="124" height="124" viewBox="0 0 124 124" role="img" aria-label="Итог ${f2(c.total)} из 100">
          <circle cx="62" cy="62" r="52" fill="none" stroke="#E2F1EB" stroke-width="11"/>
          <circle cx="62" cy="62" r="52" fill="none" stroke="#0E6A55" stroke-width="11" stroke-linecap="round" stroke-dasharray="${dash} ${C}" transform="rotate(-90 62 62)"/>
          <text x="62" y="66" text-anchor="middle" font-size="25" font-weight="700" fill="#17201C" font-family="Segoe UI, system-ui, sans-serif">${c.total == null ? '—' : f2(c.total)}</text>
          <text x="62" y="86" text-anchor="middle" font-size="12" fill="#56635D" font-family="Segoe UI, system-ui, sans-serif">из 100</text>
        </svg>
        <div class="secs">${c.secs.map(s => `<div><span>${esc(s.name)}</span><b>${fn(s.g)} / ${s.w}</b></div>`).join('')}</div>
      </div>
      <details class="small"><summary style="cursor:pointer;color:var(--accent);font-weight:600">Как посчитан итог</summary>
        <p class="muted" style="margin-top:6px">${fn(c.G)} балла из ${c.W} применимых, приведено к 100.${naRows.length ? ` N/A у критериев ${naRows.map(x => x.id).join(', ')}: их вес распределён между остальными.` : ' N/A нет, веса не перераспределялись.'}${c.pending ? ` ${c.pending} критерия ждут оценки, итог предварительный.` : ''}</p></details>
    </div>
    <div class="card pad stack">
      <h2 class="label">Почему снижена оценка</h2>
      ${c.losses.length ? c.losses.slice(0, 3).map((r, k) => { const rr = d.res[r.c.id] || {}; const ln = rr.ev && rr.ev.length ? lineBy(d, rr.ev[0]) : null;
        return `<button type="button" class="loss" data-act="goto" data-cid="${r.c.id}"><span class="pinno">${k + 1}</span>
          <span><b>${esc(r.c.name)}</b>, ${esc(ansTxt(r.c, r.a))}<br><span class="muted small">${esc(rr.why || '')}</span>${ln ? `<br><span class="small" style="color:var(--accent)">Реплика ${ln.n}${d.ch === 'call' ? `, ${mmss(ln.s)}` : ''}</span>` : ''}</span>
          <em>−${fn(r.loss)}</em></button>`; }).join('') : '<p class="muted">Все применимые критерии выполнены полностью.</p>'}
      ${c.losses.length > 3 ? `<p class="muted xs">Ещё ${c.losses.length - 3} в списке критериев. Потери посчитаны после перераспределения N/A и в сумме дают 100 − итог.</p>` : `<p class="muted xs">Потери посчитаны после перераспределения N/A и в сумме дают 100 − итог.</p>`}
    </div>
    <div class="card pad stack">
      <div class="row" style="justify-content:space-between"><h2 class="label">Грубые ошибки</h2>${flags.length ? `<span class="chip c-risk">Найдены: ${flags.length}</span>` : frr ? '<span class="chip c-ok">Не найдены</span>' : '<span class="chip c-ev">Ждут оценки</span>'}</div>
      ${fr ? fr.questions.map(q => `<div class="kv"><span>${esc(q.label)}</span>${frr && frr.a[q.k] ? '<b style="color:var(--risk)">да</b>' : '<span class="muted">нет</span>'}</div>`).join('') : ''}
      ${flags.length && frr.ev ? `<button type="button" class="btn sm" data-act="goto" data-cid="${fr.id}">Показать реплику ${frr.ev.join(', ')}</button>` : ''}
      <p class="muted xs">Каждый вид проверяется отдельным вопросом. Флаг ставится, если нарушение нашла хотя бы одна из двух моделей. Итог он не обнуляет.</p>
      ${altN ? `<p class="small" style="margin-top:auto;border-top:1px solid var(--line2);padding-top:10px">Второе мнение совпало по ${altN - disagree(d).length} из ${altN} критериев</p>` : ''}
    </div>
  </section>

  ${d.ch === 'call' ? playerHTML(d, c) : ''}

  <div class="cols">
    <section class="card" aria-label="Расшифровка">
      <div class="row" style="justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)">
        <h2 class="h2">${d.ch === 'call' ? 'Расшифровка звонка' : 'Переписка'}</h2>
        <span class="muted xs">${d.ch === 'call' ? 'Время от начала звонка. ▶ ставит запись на начало реплики' : 'Время из чата, исходные метки сохранены'}</span>
      </div>
